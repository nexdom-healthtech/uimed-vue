- textbox "Data":
    - /placeholder: 00/00/0000
    - text: /\d+\/\d+\/\d+/
- button "Selecionar data"
- text: Data
- alert
- textbox "Horário":
    - /placeholder: 00:00
    - text: /\d+:\d+/
- button "Selecionar horário"
- text: Horário
- alert
- textbox "Data e hora":
    - /placeholder: 00/00/0000 00:00
    - text: /\d+\/\d+\/\d+ \d+:\d+/
- button "Selecionar data e horário"
- text: Data e hora
- alert
- list:
    - listitem: "/date: \"\\d+-\\d+-\\d+\"/"
    - listitem: "/time: \"\\d+:\\d+\"/"
    - listitem: "/datetime: \"\\d+-\\d+-10T08:\\d+\"/"
